services:
  db:
    image: postgres:16-alpine
    container_name: fileinspector_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fileinspector
      POSTGRES_PASSWORD: fileinspector_dev_pass
      POSTGRES_DB: fileinspector_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileinspector -d fileinspector_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fileinspector_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy # tiene que estar ready la bd sino nada
    volumes:
      - ./backend:/app

volumes:
  pgdata:
